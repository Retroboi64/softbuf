[package]
name = "softbuf"
version = "0.2.0"
edition = "2024"
description = "A high-performance software framebuffer library with 2D drawing primitives and cross-platform blitting"
license = "MIT"
authors = ["Patrick Reese (Retroboi64) <https://github.com/Retroboi64>"]
repository = "https://github.com/Retroboi64/softbuf"

[dependencies]
windowed = { version = "0.3.1", path = "../windowed", optional = true, features = ["raw-window-handle"] }
raw-window-handle = { version = "0.6", optional = true }

[features]
default = ["windowed", "raw-window-handle"]
windowed = ["dep:windowed", "raw-window-handle"]
raw-window-handle = ["dep:raw-window-handle"]
rwh_06 = ["raw-window-handle"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[[example]]
name = "simple"
path = "examples/simple.rs"
required-features = ["windowed"]

[[example]]
name = "animate"
path = "examples/animate.rs"
required-features = ["windowed"]

[[example]]
name = "shapes"
path = "examples/shapes.rs"
required-features = ["windowed"]

[[example]]
name = "text_and_ui"
path = "examples/text_and_ui.rs"
required-features = ["windowed"]
